schema_version: 1
atlas_id: atlas-interoperability-lab
epoch: "2026-08-28"
promise: 固定済みの完成Subject Releaseを中立なComposition契約で組み合わせ、相互運用の正常・拒否・障害・回復を再現可能なEvidenceとして判定できる。
audiences: [learner, practitioner, architect, operator, maintainer, reviewer, educator, agent]
outcomes:
  - {id: understand, title: 境界を理解する, target_sets: [stage2-interoperability]}
  - {id: choose, title: Compositionを選ぶ, target_sets: [stage2-interoperability]}
  - {id: build, title: Labを構築する, target_sets: [stage2-interoperability]}
  - {id: verify, title: 相互運用を検証する, target_sets: [stage2-interoperability]}
  - {id: operate, title: Profileを運用する, target_sets: [stage2-interoperability]}
  - {id: troubleshoot, title: 障害伝播を診断する, target_sets: [stage2-interoperability]}
  - {id: evolve, title: 互換性を進化させる, target_sets: [stage2-interoperability]}
  - {id: delegate, title: Routerへ委任する, target_sets: [stage2-interoperability]}
surfaces:
  - {id: orientation-scope, title: 目的と境界, applicability: required, rationale: Stage 2とSubject責任の境界を固定するために必要です。, target_sets: [stage2-interoperability], required_deliverables: [concept]}
  - {id: foundations-mechanics, title: 中立Primitive, applicability: required, rationale: HTTPとJSON等の観測可能Primitiveで構成を説明します。, target_sets: [stage2-interoperability], required_deliverables: [concept]}
  - {id: architecture-design, title: Composition設計, applicability: required, rationale: 固定Release間の接続と境界を機械可読化します。, target_sets: [stage2-interoperability], required_deliverables: [decision]}
  - {id: implementation-construction, title: Harness実装, applicability: required, rationale: Profileに依存しないScenario実行器が必要です。, target_sets: [stage2-interoperability], required_deliverables: [reference-implementation]}
  - {id: testing-verification, title: Oracle検証, applicability: required, rationale: 正常と拒否の結果を決定論的に判定します。, target_sets: [stage2-interoperability], required_deliverables: [test, evidence]}
  - {id: failure-recovery, title: 障害と回復, applicability: required, rationale: 障害伝播と回復を隔離環境でEnd-to-End実証します。, target_sets: [stage2-interoperability], required_deliverables: [lab, failure-catalog]}
  - {id: operations-observability, title: 運用と可観測性, applicability: required, rationale: Trace相関と完全Cleanupを運用条件にします。, target_sets: [stage2-interoperability], required_deliverables: [runbook, evidence]}
  - {id: security-privacy-safety, title: Security Boundary, applicability: required, rationale: 無効Identityの拒否と秘密非永続化を検証します。, target_sets: [stage2-interoperability], required_deliverables: [security-review]}
  - {id: performance-capacity-cost, title: 容量と費用境界, applicability: required, rationale: Cloudを任意化しローカル資源上限を明示します。, target_sets: [stage2-interoperability], required_deliverables: [benchmark]}
  - {id: compatibility-integration, title: 互換性と統合, applicability: required, rationale: 未対応Schema Versionを暗黙変換せず拒否します。, target_sets: [stage2-interoperability], required_deliverables: [test]}
  - {id: migration-evolution-deprecation, title: 契約進化, applicability: required, rationale: VersionとDigest変更を新しいCompositionとして扱います。, target_sets: [stage2-interoperability], required_deliverables: [migration-guide]}
  - {id: decision-comparison, title: Profile比較, applicability: required, rationale: localとcontainerの同一Oracle結果を比較します。, target_sets: [stage2-interoperability], required_deliverables: [decision]}
  - {id: provenance-rights, title: 権利と来歴, applicability: required, rationale: 公開前に権利、SBOM、秘密を独立検査します。, target_sets: [stage2-interoperability], required_deliverables: [provenance-record]}
  - {id: agent-skill, title: Router Skill, applicability: required, rationale: CompositionとEvidenceへ到達しCoverage外を捏造しないRouterが必要です。, target_sets: [stage2-interoperability], required_deliverables: [skill-reference, skill-eval]}
