name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ATLAS_LAB_PUBLIC_CI_ATTESTATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
      - name: Lock Core contract
        run: |
          git clone --no-checkout https://github.com/akaitigo/reference-atlas-core.git ../reference-atlas-core
          git -C ../reference-atlas-core checkout --detach 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          test "$(git -C ../reference-atlas-core rev-parse HEAD)" = "072d7ca77981f51754e824d70c6d4ecd55ea67e5"
          git -C ../reference-atlas-core cat-file -e cf9e6e2d981305c83f970c1f21a1ddc9c1109263^{commit}
      - name: Lock FE Depth Reference
        run: |
          go run ./cmd/atlas-lab public-ci-gate
      - name: Unit and contract tests
        run: |
          go test ./...
          go run ./cmd/atlas-lab validate
          go run ./cmd/atlas-lab non-regression-gate
          python3 scripts/validate_skill.py
          python3 evals/run.py
          python3 evals/run_definitive_v2.py
          go run ./cmd/atlas-lab depth-parity
          go run ./cmd/atlas-lab definitive-matrix
          go run ./cmd/atlas-lab definitive-migrate
          go run ./cmd/atlas-lab evidence-dependency-matrix
          go run ./cmd/atlas-lab composition-compatibility-matrix
          go run ./cmd/atlas-lab composition-evidence-audit
          go run ./cmd/atlas-lab legacy-v1-check
          go run ./cmd/atlas-lab definitive-preview-audit
          go run ./cmd/atlas-lab preview-publication-gate
          go run ./cmd/atlas-lab public-ci-gate
          python3 scripts/check_dco_range.py --self-test
          python3 scripts/check_dco_range.py --base "$BASE_SHA" --head "$HEAD_SHA" --core-script ../reference-atlas-core/scripts/check_dco.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Isolate E2E output from signed baseline
        run: |
          mkdir -p /tmp/atlas-lab-e2e
          git archive HEAD | tar -x -C /tmp/atlas-lab-e2e
      - name: Local E2E
        working-directory: /tmp/atlas-lab-e2e
        run: go run ./cmd/atlas-lab reproducibility --profile local
      - name: Container E2E
        working-directory: /tmp/atlas-lab-e2e
        run: go run ./cmd/atlas-lab run --profile container
      - name: Runtime binding evidence
        working-directory: /tmp/atlas-lab-e2e
        env:
          ATLAS_LAB_REFERENCE_ROOT: ${{ github.workspace }}
        run: |
          go run ./cmd/atlas-lab runtime-binding --profile local
          go run ./cmd/atlas-lab runtime-binding --profile container
          go test ./internal/lab -run TestSavedRuntimeBindingEvidence -count=1
          ATLAS_LAB_REFERENCE_ROOT="$GITHUB_WORKSPACE" go run ./cmd/atlas-lab composition-evidence-closure
          go test ./internal/lab -run 'Test(SavedRuntimeBindingEvidence|SavedCompositionEvidenceDependencyClosure|CompositionEvidenceDependencyNegativeMatrix)' -count=1
      - name: Failure diagnostics
        working-directory: /tmp/atlas-lab-e2e
        run: |
          go run ./cmd/atlas-lab diagnose --profile local
          go run ./cmd/atlas-lab diagnose --profile container
      - name: Publication inputs
        run: |
          go run ./cmd/atlas-lab provenance
          go run ./cmd/atlas-lab publication-gate
